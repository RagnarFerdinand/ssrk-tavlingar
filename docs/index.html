<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSRK prov</title>
<style>
  :root{--bg:#f6f5f2;--kort:#fff;--text:#1d1d1f;--gra:#7a7a7a;--linje:#e3e1dc;--bla:#2f5d8a;--chip:#e6eef6}
  *{box-sizing:border-box}
  body{font:17px/1.4 -apple-system,system-ui,sans-serif;margin:0 auto;max-width:36rem;padding:1rem;background:var(--bg);color:var(--text)}
  button{font:inherit;color:inherit;cursor:pointer}
  .rad{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.5rem 0 .6rem}
  .chip{background:var(--chip);border:0;border-radius:2rem;padding:.45rem .9rem}
  .chip span{margin-left:.6rem;color:var(--gra)}
  .lagg{background:none;border:1.5px dashed #c9c6bf;border-radius:2rem;padding:.4rem .9rem;color:var(--gra)}
  .info{color:var(--gra);margin:.25rem 0 1rem}
  .kort{background:var(--kort);border:1px solid var(--linje);border-left:5px solid var(--bla);border-radius:1rem;padding:1rem 1.1rem;margin-bottom:1rem}
  .topp{display:flex;align-items:baseline;gap:.8rem}
  .datum{color:var(--bla);font-weight:600;font-size:1.1rem}
  .typ{color:var(--gra)}
  .pil{margin-left:auto;background:none;border:0;color:var(--gra);font-size:.8rem;padding:.3rem}
  .klubb{font-weight:700;font-size:1.25rem;margin-top:.2rem}
  .plats{color:var(--gra)}
  .fot{display:flex;justify-content:space-between;gap:1rem;border-top:1px solid var(--linje);margin-top:.8rem;padding-top:.8rem}
  .fot b{text-align:right}
  .mer{display:none;margin-top:.8rem;color:var(--gra);font-size:.95rem}
  .kort.oppen .mer{display:block}
  .mer a{color:var(--bla)}
  .verktyg{display:flex;justify-content:flex-end;gap:.5rem}
  .ikon{background:var(--kort);border:1px solid var(--linje);border-radius:2rem;padding:.4rem .9rem;font-size:.95rem}
  .toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:.6rem 1rem;border-radius:2rem;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.syns{opacity:1}
  .tom{color:var(--gra);text-align:center;padding:2rem 0}
  dialog{border:0;border-radius:1rem 1rem 0 0;padding:0;width:100%;max-width:36rem;margin:auto auto 0;max-height:80vh}
  dialog::backdrop{background:#0006}
  .ark-topp{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.1rem;border-bottom:1px solid var(--linje);position:sticky;top:0;background:#fff}
  .ark-topp button{background:var(--bla);color:#fff;border:0;border-radius:2rem;padding:.4rem 1rem}
  .val{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.1rem;border-bottom:1px solid var(--linje)}
  .val input{width:1.3rem;height:1.3rem;accent-color:var(--bla)}
  .val small{margin-left:auto;color:var(--gra)}
</style>
</head>
<body>
<div class="verktyg">
  <button class="ikon" id="uppdatera">↻ Uppdatera</button>
  <button class="ikon" id="dela">↗ Dela</button>
</div>
<div class="rad" id="namn"></div>
<div class="rad" id="klubb"></div>
<p class="info" id="info">Laddar…</p>
<div id="lista"></div>
<p class="info" id="uppdaterad"></p>

<dialog id="ark">
  <div class="ark-topp"><b id="ark-titel"></b><button id="klar">Klar</button></div>
  <div id="ark-lista"></div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const idag = new Date().toISOString().slice(0, 10);
const sv = (a, b) => a.localeCompare(b, "sv");
const kort = n => n.replace(/^SSRK - /, "").replace(/^SKK - /, "").replace(/^Retrieverjaktprov (\w)$/, "$1-prov");
let prov = [];
let valda = {namn: new Set(), klubb: new Set()};
try {
  const s = JSON.parse(localStorage.getItem("ssrk-val") || "{}");
  valda = {namn: new Set(s.namn || []), klubb: new Set(s.klubb || [])};
} catch (e) {}
const url = new URLSearchParams(location.search);
if (url.has("t") || url.has("a")) {
  valda = {namn: new Set(url.getAll("t")), klubb: new Set(url.getAll("a"))};
}
const spara = () => { try { localStorage.setItem("ssrk-val", JSON.stringify({namn: [...valda.namn], klubb: [...valda.klubb]})); } catch (e) {} };

function datumText(d) {
  return new Date(d + "T12:00").toLocaleDateString("sv-SE", {weekday: "short", day: "numeric", month: "long", year: "numeric"});
}
function anmalan(t) {
  if (!t.anmalan_slut) return "";
  if (idag < t.anmalan_start) return "Anmälan öppnar " + t.anmalan_start;
  if (idag <= t.anmalan_slut) return "Anmälan öppen till " + t.anmalan_slut;
  return "Anmälan stängd";
}

const RUBRIK = {namn: "Tävling", klubb: "Arrangör"};
function ritaChips(falt) {
  const el = $(falt);
  el.innerHTML = "";
  [...valda[falt]].sort(sv).forEach(v => {
    const b = document.createElement("button");
    b.className = "chip";
    b.innerHTML = `${falt === "namn" ? kort(v) : v}<span>✕</span>`;
    b.onclick = () => { valda[falt].delete(v); uppdatera(); };
    el.append(b);
  });
  const lagg = document.createElement("button");
  lagg.className = "lagg";
  lagg.textContent = "+ " + RUBRIK[falt];
  lagg.onclick = () => oppna(falt, RUBRIK[falt]);
  el.append(lagg);
}

function ritaLista() {
  const rader = prov.filter(t => (!valda.namn.size || valda.namn.has(t.namn)) &&
                                 (!valda.klubb.size || valda.klubb.has(t.klubb)));
  const typer = valda.namn.size ? [...valda.namn].map(kort).join(", ") : "Alla tävlingar";
  const avd = valda.klubb.size ? [...valda.klubb].join(", ") : "Alla arrangörer";
  $("info").textContent = `${avd} · ${typer} · ${rader.length} prov`;
  $("lista").innerHTML = rader.map(t => {
    const dat = datumText(t.datum) + (t.slutdatum !== t.datum ? " – " + datumText(t.slutdatum) : "");
    return `<div class="kort">
      <div class="topp"><span class="datum">${dat}</span><span class="typ">${kort(t.namn)}</span><button class="pil" aria-label="Visa mer">▾</button></div>
      <div class="klubb">${t.klubb}</div>
      <div class="plats">${t.plats}</div>
      <div class="fot"><span class="plats">${t.klasser.filter(k => !/^(Officiellt|Inofficiellt)$/.test(k)).join(", ")}</span><b>${t.avgift}</b></div>
      <div class="mer">${anmalan(t)}<br>${t.klasser.includes("Inofficiellt") ? "Inofficiellt" : "Officiellt"} · <a href="${t.url}">Anmälan i SKK Start →</a></div>
    </div>`;
  }).join("") || `<p class="tom">Inga prov matchar valen.</p>`;
}

function uppdatera() { spara(); ritaChips("namn"); ritaChips("klubb"); ritaLista(); }

function oppna(falt, titel) {
  $("ark-titel").textContent = titel;
  const antal = {};
  prov.forEach(t => { antal[t[falt]] = (antal[t[falt]] || 0) + 1; });
  $("ark-lista").innerHTML = Object.keys(antal).filter(Boolean).sort(sv).map((v, i) =>
    `<label class="val"><input type="checkbox" data-v="${v.replace(/"/g, "&quot;")}" ${valda[falt].has(v) ? "checked" : ""}>
     ${falt === "namn" ? kort(v) : v}<small>${antal[v]}</small></label>`).join("");
  $("ark-lista").querySelectorAll("input").forEach(i => i.onchange = () => {
    i.checked ? valda[falt].add(i.dataset.v) : valda[falt].delete(i.dataset.v);
    uppdatera();
  });
  $("ark").showModal();
}

$("klar").onclick = () => $("ark").close();
$("ark").onclick = e => { if (e.target === $("ark")) $("ark").close(); };
$("lista").onclick = e => { const k = e.target.closest(".kort"); if (k) k.classList.toggle("oppen"); };

function toast(text) {
  $("toast").textContent = text;
  $("toast").classList.add("syns");
  setTimeout(() => $("toast").classList.remove("syns"), 2000);
}

function delningslank() {
  const q = new URLSearchParams();
  valda.namn.forEach(v => q.append("t", v));
  valda.klubb.forEach(v => q.append("a", v));
  return location.origin + location.pathname + (q.toString() ? "?" + q : "");
}

$("dela").onclick = async () => {
  const lank = delningslank();
  const titel = "SSRK prov – " + $("info").textContent;
  try {
    if (navigator.share) { await navigator.share({title: titel, url: lank}); return; }
    await navigator.clipboard.writeText(lank);
    toast("Länken är kopierad");
  } catch (e) {
    if (e.name !== "AbortError") prompt("Kopiera länken:", lank);
  }
};

function hamta() {
  return fetch("data/tavlingar.json?t=" + Date.now(), {cache: "no-store"}).then(r => r.json()).then(d => {
  prov = d.tavlingar.filter(t => t.slutdatum >= idag);
  $("uppdaterad").textContent = `Källa: SKK Start. Uppdaterad ${d.uppdaterad}. Prov som inte publiceras i SKK Start syns inte.`;
  uppdatera();
  return d;
  });
}
hamta();
$("uppdatera").onclick = () => hamta()
  .then(d => toast(`Uppdaterad · data från ${d.uppdaterad}`))
  .catch(() => toast("Kunde inte hämta, försök igen"));
</script>
</body>
</html>
